              <span>Add Exercise to {activeWorkoutDraft.routineName}</span>
            </button>
          ) : (
            <form
              onSubmit={handleAddExerciseSubmit}
              className="bg-white dark:bg-navy-900 rounded-2xl p-4 border border-gold-500/50 space-y-3"
            >
              <div className="flex items-center justify-between">
                <h4 className="font-bold text-sm text-gold-500 uppercase font-mono">Add Exercise</h4>
                <button type="button" onClick={() => setShowAddExercise(false)} className="text-slate-400">
                  <Icon name="x" size={18} />
                </button>
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-4 gap-3">
                <div className="sm:col-span-2">
                  <label className="text-xs text-slate-400 block mb-1">Exercise Name</label>
                  <input
                    type="text"
                    required
                    value={newExName}
                    onChange={(e) => setNewExName(e.target.value)}
                    placeholder="e.g., Weighted Dips"
                    className="w-full px-3 py-2 rounded-xl bg-slate-100 dark:bg-navy-800 border border-slate-300 dark:border-navy-700 text-sm"
                  />
                </div>
                <div>
                  <label className="text-xs text-slate-400 block mb-1">Rep Range</label>
                  <input
                    type="text"
                    value={newExRepRange}
                    onChange={(e) => setNewExRepRange(e.target.value)}
                    placeholder="8–12"
                    className="w-full px-3 py-2 rounded-xl bg-slate-100 dark:bg-navy-800 border border-slate-300 dark:border-navy-700 text-sm font-mono"
                  />
                </div>
                <div>
                  <label className="text-xs text-slate-400 block mb-1">Working Weight (lbs)</label>
                  <input
                    type="number"
                    value={newExWeight}
                    onChange={(e) => setNewExWeight(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl bg-slate-100 dark:bg-navy-800 border border-slate-300 dark:border-navy-700 text-sm font-mono"
                  />
                </div>
              </div>
              <div className="flex justify-end gap-2">
                <button
                  type="submit"
                  className="px-4 py-2 rounded-xl bg-gold-500 text-navy-950 font-bold text-xs"
                >
                  Add to Routine
                </button>
              </div>
            </form>
          )}

          {/* Primary Bottom Finish & Save CTA */}
          <div className="bg-gradient-to-r from-navy-900 to-navy-800 border border-gold-500/40 rounded-2xl p-4 flex flex-col sm:flex-row items-center justify-between gap-3 shadow-lg">
            <div className="text-center sm:text-left">
              <h4 className="font-extrabold text-white text-base">
                Ready to wrap up {activeWorkoutDraft.routineName}?
              </h4>
              <p className="text-xs text-slate-300">
                Commits session to Workout History, updates Previous Bests, and resets draft.
              </p>
            </div>
            <button
              onClick={finishAndSaveWorkout}
              className="w-full sm:w-auto px-6 py-3.5 rounded-xl bg-gold-500 hover:bg-gold-400 text-navy-950 font-black text-sm flex items-center justify-center gap-2 shadow-lg shadow-gold-500/20 active:scale-95 transition"
            >
              <Icon name="award" size={18} />
              <span>Finish & Save Workout</span>
            </button>
          </div>

          {/* New Custom Routine Modal */}
          {showNewRoutineModal && (
            <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
              <form
                onSubmit={handleCreateRoutine}

${JSON.stringify(snapshot)}

        try {
          const selectedModel = settings.geminiModel || 'gemini-4-hydrogen';
          const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${selectedModel}:generateContent?key=${encodeURIComponent(settings.geminiApiKey.trim())}`;

          const response = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              systemInstruction: {
                parts: [{ text: systemInstructionText }]
              },
              contents: [
                {
                  role: 'user',
                  parts: [{ text: cleanText }]
                }
              ],
              generationConfig: {
                responseMimeType: 'application/json',
                temperature: 0.4
              }
            })
          });

          if (!response.ok) {
            const errText = await response.text();
            throw new Error(`API ${response.status}: ${errText.slice(0, 140)}`);
          }

          const data = await response.json();
          const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text || '{}';

          // Parse structured JSON safely even if wrapped in code fences
          const cleanedJson = rawText.replace(/^```json\s*/i, '').replace(/```$/i, '').trim();
          let parsed = { reply: rawText, actions: [] };
          try {
            parsed = JSON.parse(cleanedJson);
          } catch (e) {}

          const badges = executeAgentActions(parsed.actions || []);
          setChatMessages(prev => [
            ...prev,
            {
              id: `ai-${Date.now()}`,
              role: 'assistant',
              content: parsed.reply || 'Command executed.',
              actionsExecuted: badges
            }
          ]);
        } catch (err) {
          setChatMessages(prev => [
            ...prev,
            {
              id: `ai-err-${Date.now()}`,
              role: 'assistant',
              content: `⚠️ Gemini API Connection Notice (${settings.geminiModel}): ${err.message}. Check your API Key or switch models in Sync & Settings.`,

            }

        } finally {

    // ============================================================================
    // MODULE D: PROGRESS (MORNING BODYWEIGHT SVG CHART & WORKOUT HISTORY LOG)
    // ============================================================================
    function ProgressModule({
      weightHistory,
      setWeightHistory,
      workoutHistory,
      setWorkoutHistory,
      showToast
    }) {
      const [weightInput, setWeightInput] = useState('');
      const [weightDate, setWeightDate] = useState(getTodayISO());
      const [weightNotes, setWeightNotes] = useState('');
      const [searchQuery, setSearchQuery] = useState('');

      const handleLogWeight = (e) => {
        e.preventDefault();
        const val = parseFloat(weightInput);
        if (isNaN(val) || val < 90 || val > 350) {
          showToast('Enter a valid bodyweight in lbs', 'amber');
          return;
        }
        setWeightHistory(prev => {
          const filtered = prev.filter(w => w.date !== weightDate);
          return [...filtered, { id: `w-${Date.now()}`, date: weightDate, weight: val, notes: weightNotes || 'Morning weigh-in' }]
            .sort((a, b) => a.date.localeCompare(b.date));
        });
        setWeightInput('');
        setWeightNotes('');
        showToast(`⚖️ Logged morning weight: ${val.toFixed(1)} lbs`, 'emerald');
      };

      // SVG Trend Chart Geometry
      const chartData = weightHistory.slice(-14);
      const weights = chartData.map(d => d.weight);
      const minW = Math.min(...weights, 157) - 1.5;
      const maxW = Math.max(...weights, 165) + 1.5;
      const svgWidth = 640;
      const svgHeight = 200;
      const padX = 40;
      const padY = 24;

      const points = chartData.map((d, i) => {
        const x = chartData.length === 1
          ? svgWidth / 2
          : padX + (i / (chartData.length - 1)) * (svgWidth - padX * 2);
        const y = svgHeight - padY - ((d.weight - minW) / Math.max(1, maxW - minW)) * (svgHeight - padY * 2);
        return { x, y, ...d };
      });

      const polylinePoints = points.map(p => `${p.x},${p.y}`).join(' ');

      const filteredWorkouts = useMemo(() => {
        const q = searchQuery.trim().toLowerCase();
        if (!q) return workoutHistory;
        return workoutHistory.filter(w =>
          w.routineName.toLowerCase().includes(q) ||
          w.date.includes(q) ||
          w.exercises.some(ex => ex.name.toLowerCase().includes(q))
        );
      }, [workoutHistory, searchQuery]);

      return (
        <div className="space-y-5">
          {/* Morning Bodyweight Logger & SVG Trend Chart */}
          <div className="bg-white dark:bg-navy-900 rounded-2xl p-4 sm:p-5 border border-slate-200 dark:border-navy-800 shadow-sm">
            <div className="flex flex-wrap items-center justify-between gap-2 mb-4">
              <div>
                <span className="text-[11px] font-mono uppercase tracking-wider text-gold-500 font-bold">
                  Baseline: 160.0 lbs (5'11") • Target Lean Bulk: +0.5 lb/wk
                </span>
                <h2 className="text-xl sm:text-2xl font-black text-slate-900 dark:text-white">
                  Morning Bodyweight Trend
                </h2>
              </div>
              {weightHistory.length > 0 && (
                <div className="px-3.5 py-2 rounded-xl bg-navy-800 text-gold-400 font-mono text-sm font-black">
                  Current: {weightHistory[weightHistory.length - 1].weight.toFixed(1)} lbs
                </div>
              )}
            </div>

            {/* SVG Line Chart */}
            <div className="w-full overflow-x-auto bg-slate-50 dark:bg-navy-950/90 rounded-xl p-3 border border-slate-200 dark:border-navy-800 mb-4">
              <svg viewBox={`0 0 ${svgWidth} ${svgHeight}`} className="w-full h-44 overflow-visible">
                {/* Horizontal Reference Grid Lines */}
                {[0.2, 0.5, 0.8].map((ratio, idx) => {
                  const y = padY + ratio * (svgHeight - padY * 2);
                  const val = (maxW - ratio * (maxW - minW)).toFixed(1);
                  return (
                    <g key={idx}>
                      <line x1={padX} y1={y} x2={svgWidth - padX} y2={y} stroke="currentColor" className="text-slate-200 dark:text-navy-800" strokeDasharray="4 4" />
                      <text x={6} y={y + 4} className="fill-slate-400 font-mono text-[10px]">{val}</text>
                    </g>
                  );
                })}

                {/* Trend Line */}
                {points.length > 1 && (
                  <polyline
                    fill="none"
                    stroke="#F5B700"
                    strokeWidth="3"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    points={polylinePoints}
                  />
                )}

                {/* Data Points */}
                {points.map((p, idx) => (
                  <g key={p.id || idx}>
                    <circle cx={p.x} cy={p.y} r="5" className="fill-gold-500 stroke-navy-950" strokeWidth="2" />
                    <text x={p.x} y={p.y - 10} textAnchor="middle" className="fill-slate-700 dark:fill-gold-400 font-mono text-[10px] font-bold">
                      {p.weight.toFixed(1)}
                    </text>
                    <text x={p.x} y={svgHeight - 6} textAnchor="middle" className="fill-slate-400 font-mono text-[9px]">
                      {p.date.slice(5)}
                    </text>
                  </g>
                ))}
              </svg>
            </div>

            {/* Log Weight Form */}
            <form onSubmit={handleLogWeight} className="grid grid-cols-1 sm:grid-cols-4 gap-2.5">
              <input
                type="number"
                step="0.1"
                required
                value={weightInput}
                onChange={(e) => setWeightInput(e.target.value)}
                placeholder="Morning Weight (e.g. 160.6)"
                className="px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-navy-800 border border-slate-300 dark:border-navy-700 text-sm font-mono font-bold"
              />
              <input
                type="date"
                value={weightDate}
                onChange={(e) => setWeightDate(e.target.value)}
                className="px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-navy-800 border border-slate-300 dark:border-navy-700 text-sm font-mono"
              />
              <input
                type="text"
                value={weightNotes}
                onChange={(e) => setWeightNotes(e.target.value)}
                placeholder="Notes (e.g., Post 5-mile run)"
                className="px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-navy-800 border border-slate-300 dark:border-navy-700 text-sm"
              />
              <button
                type="submit"
                className="py-2.5 px-4 rounded-xl bg-gold-500 hover:bg-gold-400 text-navy-950 font-black text-sm transition"
              >
                + Log Weight
              </button>
            </form>
          </div>

          {/* Searchable Workout History Log */}
          <div className="bg-white dark:bg-navy-900 rounded-2xl p-4 sm:p-5 border border-slate-200 dark:border-navy-800 shadow-sm space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-2">
              <div>
                <h3 className="text-lg font-extrabold text-slate-900 dark:text-white">
                  Completed Workout History ({filteredWorkouts.length})
                </h3>
                <p className="text-xs text-slate-500 dark:text-slate-400">
                  Search by routine (Push, Pull, Legs), exercise name, or date.
                </p>
              </div>
              <div className="relative w-full sm:w-64">
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="Search Bench, Pull, 2025-02..."
                  className="w-full pl-9 pr-3 py-2 rounded-xl bg-slate-100 dark:bg-navy-800 border border-slate-300 dark:border-navy-700 text-xs sm:text-sm"
                />
                <span className="absolute left-3 top-2.5 text-slate-400">
                  <Icon name="search" size={15} />
                </span>
              </div>
            </div>

            {filteredWorkouts.length === 0 ? (
              <p className="text-sm text-slate-400 py-8 text-center">No matching workouts found.</p>
            ) : (
              <div className="space-y-3">
                {filteredWorkouts.map(session => (
                  <div
                    key={session.id}
                    className="p-4 rounded-xl bg-slate-50 dark:bg-navy-950/70 border border-slate-200 dark:border-navy-800 space-y-2"
                  >
                    <div className="flex flex-wrap items-center justify-between gap-2">
                      <div>
                        <span className="font-extrabold text-sm sm:text-base text-slate-900 dark:text-white">
                          {session.routineName}
                        </span>
                        <span className="ml-2 font-mono text-xs text-slate-400">{session.date}</span>
                      </div>
                      <div className="flex items-center gap-2 font-mono text-xs">
                        <span className="px-2 py-0.5 rounded bg-gold-500/20 text-gold-500 font-bold">
                          {session.totalVolume?.toLocaleString() || 0} lbs vol
                        </span>
                        <span className="text-slate-400">{session.durationMinutes || 45} min</span>
                      </div>
                    </div>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-1">
                      {session.exercises.map((ex, idx) => (
                        <div key={idx} className="text-xs bg-white dark:bg-navy-900 p-2 rounded-lg border border-slate-200/60 dark:border-navy-800">
                          <div className="font-bold text-slate-800 dark:text-slate-200">{ex.name}</div>
                          <div className="font-mono text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">
                            {ex.sets.map(s => `${s.weight}×${s.reps}`).join(' • ')}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    // ============================================================================

    function SettingsSyncModule({
      settings,
      setSettings,
      syncBusy,
      pushToSupabase,
      pullFromSupabase,
      routines,
      setRoutines,
      workoutHistory,
      setWorkoutHistory,
      weightHistory,

      setMealLibrary,
      dailyNutritionLogs,
      setDailyNutritionLogs,
      showToast
    }) {
      const fileInputRef = useRef(null);

      const SQL_SNIPPET = `create table if not exists public.user_sync (user_id text primary key, payload jsonb not null, updated_at timestamptz default now());
alter table public.user_sync enable row level security;
create policy "Public Sync Access" on public.user_sync for all using (true) with check (true);`;

      const copySqlSnippet = () => {
        const ta = document.createElement('textarea');
        ta.value = SQL_SNIPPET;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('Copied 3-line Supabase SQL snippet to clipboard!');
      };

      const handleExportJSON = () => {
        const fullBackup = {
          exportedAt: new Date().toISOString(),
          app: 'USNA Fit & Fuel',
          routines,
          workoutHistory,
          weightHistory,
          activeWorkoutDraft,
          macroTargets,
          mealLibrary,
          dailyNutritionLogs
        };
        const blob = new Blob([JSON.stringify(fullBackup, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `usna-fit-fuel-backup-${getTodayISO()}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('Downloaded JSON backup file!');
      };

      const handleImportJSONFile = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const parsed = JSON.parse(ev.target.result);
            if (parsed.routines) setRoutines(parsed.routines);
            if (parsed.workoutHistory) setWorkoutHistory(parsed.workoutHistory);
            if (parsed.weightHistory) setWeightHistory(parsed.weightHistory);
            if (parsed.activeWorkoutDraft) setActiveWorkoutDraft(parsed.activeWorkoutDraft);
            if (parsed.macroTargets) setMacroTargets(parsed.macroTargets);
            if (parsed.mealLibrary) setMealLibrary(parsed.mealLibrary);
            if (parsed.dailyNutritionLogs) setDailyNutritionLogs(parsed.dailyNutritionLogs);
            showToast('✅ Restored all workouts, meals & history from JSON!', 'emerald');
          } catch (err) {
            showToast('Invalid JSON backup file.', 'amber');
          }
        };
        reader.readAsText(file);
      };

      return (
        <div className="space-y-5">
          {/* Gemini API & Model Configuration */}
          <div className="bg-white dark:bg-navy-900 rounded-2xl p-4 sm:p-5 border border-slate-200 dark:border-navy-800 shadow-sm space-y-4">
            <div>
              <span className="text-[11px] font-mono uppercase tracking-wider text-gold-500 font-bold">
                AI Coaching & Structured Tool Execution
              </span>

                Gemini Agent Configuration
              </h2>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <label className="text-xs font-bold text-slate-400 block mb-1">
                  Gemini API Key (Stored locally on device)
                </label>
                <input
                  type="password"
                  value={settings.geminiApiKey}
                  onChange={(e) => setSettings(prev => ({ ...prev, geminiApiKey: e.target.value }))}
                  placeholder="AIzaSy..."
                  className="w-full px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-navy-800 border border-slate-300 dark:border-navy-700 text-sm font-mono"
                />

              <div>

                <select

                  onChange={(e) => setSettings(prev => ({ ...prev, geminiModel: e.target.value }))}
                  className="w-full px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-navy-800 border border-slate-300 dark:border-navy-700 text-sm font-mono font-bold"
                >
                  <option value="gemini-4-hydrogen">gemini-4-hydrogen (Default)</option>
                  <option value="gemini-3.8-flash">gemini-3.8-flash</option>
                  <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite</option>
                </select>
              </div>
            </div>
          </div>

          {/* Supabase Cross-Device Cloud Sync */}
          <div className="bg-white dark:bg-navy-900 rounded-2xl p-4 sm:p-5 border border-slate-200 dark:border-navy-800 shadow-sm space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-2">

                  onChange={(e) => setSettings(prev => ({ ...prev, syncUserId: e.target.value }))}
                  placeholder="midn-usna-2026"
                  className="w-full px-3.5 py-2.5 rounded-xl bg-slate-100 dark:bg-navy-800 border border-slate-300 dark:border-navy-700 text-sm font-mono font-bold"
                />
              </div>
            </div>

            <div className="flex flex-wrap items-center gap-3 pt-1">
              <button
                onClick={() => pushToSupabase(false)}
                disabled={syncBusy}
                className="px-4 py-2.5 rounded-xl bg-gold-500 hover:bg-gold-400 text-navy-950 font-black text-xs sm:text-sm flex items-center gap-2 transition"
              >
                <Icon name="upload" size={16} />
                <span>{syncBusy ? 'Syncing...' : 'Push Local State to Cloud'}</span>
              </button>
              <button
                onClick={pullFromSupabase}
                disabled={syncBusy}
                className="px-4 py-2.5 rounded-xl bg-slate-200 dark:bg-navy-800 hover:bg-navy-700 text-slate-900 dark:text-white font-bold text-xs sm:text-sm flex items-center gap-2 transition"
              >
                <Icon name="download" size={16} />
                <span>Pull Cloud State to Device</span>
              </button>
            </div>

            {/* Copyable 3-Line SQL Setup Snippet */}
            <div className="p-3.5 rounded-xl bg-slate-900 text-slate-200 border border-navy-700 space-y-2">
              <div className="flex items-center justify-between">
                <span className="text-xs font-mono text-gold-400 font-bold">
                  Supabase SQL Editor Setup (3-Line Table Snippet)
                </span>
                <button
                  onClick={copySqlSnippet}
                  className="px-2.5 py-1 rounded bg-navy-800 hover:bg-gold-500 hover:text-navy-950 text-xs font-mono font-bold flex items-center gap-1 transition"
                >
                  <Icon name="copy" size={13} />
                  <span>Copy SQL</span>
                </button>
              </div>
              <pre className="text-[11px] font-mono text-slate-300 overflow-x-auto whitespace-pre-wrap leading-relaxed">
                {SQL_SNIPPET}
              </pre>
            </div>
          </div>

          {/* 1-Click JSON Export / Import */}
          <div className="bg-white dark:bg-navy-900 rounded-2xl p-4 sm:p-5 border border-slate-200 dark:border-navy-800 shadow-sm flex flex-wrap items-center justify-between gap-4">
            <div>
              <h3 className="font-extrabold text-base text-slate-900 dark:text-white">
                Local JSON Snapshot Backup
              </h3>
              <p className="text-xs text-slate-500 dark:text-slate-400">
                Export your entire workout history, routines, King Hall logs, and bodyweight data to a portable JSON file.
              </p>
            </div>

            <div className="flex items-center gap-2.5">
              <button
                onClick={handleExportJSON}
                className="px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-navy-800 hover:bg-gold-500 hover:text-navy-950 font-bold text-xs sm:text-sm flex items-center gap-2 transition"
              >
                <Icon name="download" size={16} />
                <span>Export JSON</span>
              </button>

              <input
                ref={fileInputRef}
                type="file"
                accept=".json,application/json"
                onChange={handleImportJSONFile}
                className="hidden"
              />
              <button
                onClick={() => fileInputRef.current?.click()}
                className="px-4 py-2.5 rounded-xl bg-slate-100 dark:bg-navy-800 hover:bg-emerald-500 hover:text-navy-950 font-bold text-xs sm:text-sm flex items-center gap-2 transition"
              >
                <Icon name="upload" size={16} />
                <span>Import JSON</span>
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Mount Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
