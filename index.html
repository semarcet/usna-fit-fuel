        date: '2025-02-14',
        routineName: 'Friday: Pull',
        durationMinutes: 51,
        totalVolume: 10920,
        exercises: [
          {

    const createDraftFromRoutine = (routine) => ({
      routineId: routine.id,
      routineName: routine.name,
      subtitle: routine.subtitle || '',
      startedAt: Date.now(),
      lastSavedAt: Date.now(),
      hasUserEdits: false,
      exercises: routine.exercises.map(ex => ({
        ...ex,
        sets: ex.sets.map(s => ({ ...s, completed: false }))
      }))
    });

    const STORAGE_KEY = 'usna_fit_fuel_master_v1';
    const DRAFT_STORAGE_KEY = 'usna_fit_fuel_active_draft_v1';
    const TIMER_STORAGE_KEY = 'usna_fit_fuel_rest_timer_v1';

    // ============================================================================
    // 3. WEB AUDIO API ENGINE (iOS Background-Safe Scheduled Chime)
    // ============================================================================
    const audioEngine = {
      ctx: null,
      scheduledNodes: [],

      unlock() {
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return null;
          if (!this.ctx) {
            this.ctx = new AudioCtx();
          }
          if (this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
          // Play silent micro-buffer to unlock iOS Safari audio hardware
          const buffer = this.ctx.createBuffer(1, 1, 22050);
          const source = this.ctx.createBufferSource();
          source.buffer = buffer;
          source.connect(this.ctx.destination);
          source.start(0);
          return this.ctx;
        } catch (e) {
          return null;
        }
      },

      cancelScheduled() {
        this.scheduledNodes.forEach(node => {
          try {
            node.stop();
            node.disconnect();
          } catch (e) {}
        });
        this.scheduledNodes = [];
      },

      scheduleChimeInSeconds(secondsFromNow) {
        try {
          const ctx = this.unlock();
          if (!ctx) return;
          this.cancelScheduled();

          const delay = Math.max(0.05, secondsFromNow);
          const startTime = ctx.currentTime + delay;

          // Tactical 3-tone Navy Boatswain / Gym Bell Chime (A5 -> C#6 -> E6)
          const freqs = [880, 1108.73, 1318.51];
          freqs.forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, startTime + idx * 0.16);

            gain.gain.setValueAtTime(0.0001, startTime + idx * 0.16);
            gain.gain.exponentialRampToValueAtTime(0.35, startTime + idx * 0.16 + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.0001, startTime + idx * 0.16 + 0.45);

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start(startTime + idx * 0.16);
            osc.stop(startTime + idx * 0.16 + 0.48);
            this.scheduledNodes.push(osc);
          });
        } catch (e) {}
      },

      playImmediateChime() {
        this.scheduleChimeInSeconds(0.02);
      }
    };

    // ============================================================================
    // 4. MAIN APPLICATION COMPONENT
    // ============================================================================
    function App() {
      // Load persisted master state
      const loadInitialState = () => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            return parsed;
          }
        } catch (e) {}
        return null;

      const savedState = useMemo(() => loadInitialState(), []);

      // Navigation & Theme
      const [activeTab, setActiveTab] = useState('workout');
      const [darkMode, setDarkMode] = useState(savedState?.darkMode ?? true);

      // Toast Notification & Custom Modal State
      const [toast, setToast] = useState(null);
      const [confirmModal, setConfirmModal] = useState(null);

      const showToast = useCallback((message, type = 'gold') => {
        setToast({ id: Date.now(), message, type });
      }, []);

      useEffect(() => {
        if (!toast) return;
        const t = setTimeout(() => setToast(null), 3800);
        return () => clearTimeout(t);
      }, [toast]);

      // Apply dark mode class to <html>
      useEffect(() => {
        const root = document.documentElement;
        if (darkMode) {
          root.classList.add('dark');
        } else {
          root.classList.remove('dark');
        }
      }, [darkMode]);

      // --------------------------------------------------------------------------
      // CORE DATA STATES
      // --------------------------------------------------------------------------
      const [routines, setRoutines] = useState(() => savedState?.routines || INITIAL_ROUTINES);
      const [workoutHistory, setWorkoutHistory] = useState(() => savedState?.workoutHistory || INITIAL_WORKOUT_HISTORY);
      const [weightHistory, setWeightHistory] = useState(() => savedState?.weightHistory || INITIAL_WEIGHT_HISTORY);

      // Active Workout Draft (Instant Keystroke & Checkbox Auto-Save)
      const [activeWorkoutDraft, setActiveWorkoutDraft] = useState(() => {
        try {
          const savedDraft = localStorage.getItem(DRAFT_STORAGE_KEY);
          if (savedDraft) {
            return JSON.parse(savedDraft);
          }
        } catch (e) {}
        if (savedState?.activeWorkoutDraft) return savedState.activeWorkoutDraft;
        return createDraftFromRoutine(INITIAL_ROUTINES[0]);
      });

      // Workout Elapsed Seconds Counter (based on activeWorkoutDraft.startedAt)
      const [workoutElapsedSeconds, setWorkoutElapsedSeconds] = useState(0);

      useEffect(() => {
        const updateElapsed = () => {
          if (activeWorkoutDraft?.startedAt) {
            const diff = Math.max(0, Math.floor((Date.now() - activeWorkoutDraft.startedAt) / 1000));
            setWorkoutElapsedSeconds(diff);
          }
        };
        updateElapsed();
        const interval = setInterval(updateElapsed, 1000);
        return () => clearInterval(interval);
      }, [activeWorkoutDraft?.startedAt]);

      // Nutrition & Daily Habits
      const [macroTargets, setMacroTargets] = useState(() => savedState?.macroTargets || {
        calories: 3400,
        protein: 155,
        carbs: 450,
        fat: 90
      });
      const [mealLibrary, setMealLibrary] = useState(() => savedState?.mealLibrary || KING_HALL_MEAL_LIBRARY);
      const [dailyNutritionLogs, setDailyNutritionLogs] = useState(() => savedState?.dailyNutritionLogs || {
        [getTodayISO()]: {
          meals: [
            { id: 'm-init-1', name: 'Breakfast Eggs (3 Whole) & Oatmeal Bowl', calories: 520, protein: 28, carbs: 56, fat: 20, time: '07:10 AM', servings: 1 },
            { id: 'm-init-2', name: 'Honey Pre-Run Fuel (2 tbsp)', calories: 130, protein: 0, carbs: 34, fat: 0, time: '06:00 AM', servings: 1 }
          ],
          habits: {
            creatine: true,
            hydration: false,
            run: false
          }
        }
      });

      // Settings & Cloud Sync Configuration
      const [settings, setSettings] = useState(() => savedState?.settings || {
        geminiApiKey: '',
        geminiModel: 'gemini-4-hydrogen',
        supabaseUrl: '',
        supabaseAnonKey: '',
        syncUserId: 'midn-usna-2026',
        autoSync: false,
        lastSyncedAt: null
      });

      // Coach AI Chat History
      const [chatMessages, setChatMessages] = useState(() => savedState?.chatMessages || [
        {
          id: 'welcome-msg',
          role: 'assistant',
          content: "Beat Army! Welcome to USNA Fit & Fuel. I'm tracking your 5'11\", 160 lb lean-bulk protocol (3,400 kcal target while running 20–25 miles/week). Ask me to log King Hall meals, check off your daily creatine or 5-mile run, or adjust your Push/Pull/Legs weights!",
          actionsExecuted: []
        }
      ]);

      // --------------------------------------------------------------------------
      // INSTant AUTO-SAVE OF DRAFT & MASTER STATE TO LOCALSTORAGE
      // --------------------------------------------------------------------------
      useEffect(() => {
        try {
          localStorage.setItem(DRAFT_STORAGE_KEY, JSON.stringify(activeWorkoutDraft));
        } catch (e) {}
      }, [activeWorkoutDraft]);

      useEffect(() => {
        try {
          const masterPayload = {
            darkMode,
            routines,
            workoutHistory,
            weightHistory,
            activeWorkoutDraft,
            macroTargets,
            mealLibrary,
            dailyNutritionLogs,
            settings,
            chatMessages,
            updatedAt: Date.now()
          };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(masterPayload));
        } catch (e) {}
      }, [
        darkMode,
        routines,
        workoutHistory,
        weightHistory,
        activeWorkoutDraft,
        macroTargets,
        mealLibrary,
        dailyNutritionLogs,
        settings,
        chatMessages
      ]);

      // --------------------------------------------------------------------------
      // 5. iOS BACKGROUND-SAFE FLOATING REST TIMER ENGINE
      // --------------------------------------------------------------------------
      const loadSavedTimer = () => {
        try {
          const raw = localStorage.getItem(TIMER_STORAGE_KEY);
          if (raw) return JSON.parse(raw);
        } catch (e) {}
        return {
          status: 'idle', // 'idle' | 'running' | 'paused' | 'completed'
          totalDuration: 90,
          timerEndTimestamp: null,
          pausedRemaining: 90,
          label: 'Rest Timer'
        };
      };

      const [timerState, setTimerState] = useState(loadSavedTimer);
      const [displaySeconds, setDisplaySeconds] = useState(() => {
        const init = loadSavedTimer();
        if (init.status === 'running' && init.timerEndTimestamp) {
          return Math.max(0, Math.ceil((init.timerEndTimestamp - Date.now()) / 1000));
        }
        return init.pausedRemaining || init.totalDuration || 90;
      });

      // Persist timerState to localStorage immediately
      useEffect(() => {
        try {
          localStorage.setItem(TIMER_STORAGE_KEY, JSON.stringify(timerState));
        } catch (e) {}
      }, [timerState]);

      // Trigger browser notification if permitted
      const notifyTimerFinished = useCallback((exerciseLabel) => {
        audioEngine.playImmediateChime();
        showToast(`⏱️ Rest Complete! Ready for next set (${exerciseLabel || 'Go!'})`, 'emerald');
        if ('Notification' in window && Notification.permission === 'granted') {
          try {
            new Notification('USNA Fit & Fuel — Rest Complete!', {
              body: `Time to hit your next set of ${exerciseLabel || 'your workout'}.`,
              silent: false
            });
          } catch (e) {}
        }
      }, [showToast]);

      // Core epoch timestamp sync function (runs on tick + visibilitychange + focus)
      const syncTimerWithClock = useCallback(() => {
        setTimerState(prev => {
          if (prev.status !== 'running' || !prev.timerEndTimestamp) {
            return prev;
          }
          const remaining = Math.max(0, Math.ceil((prev.timerEndTimestamp - Date.now()) / 1000));
          setDisplaySeconds(remaining);

          if (remaining <= 0) {
            notifyTimerFinished(prev.label);
            return {
              ...prev,
              status: 'completed',
              timerEndTimestamp: null,
              pausedRemaining: 0
            };
          }
          return prev;
        });
      }, [notifyTimerFinished]);

      useEffect(() => {
        if (timerState.status === 'running') {
          syncTimerWithClock();
          const interval = setInterval(syncTimerWithClock, 250);
          return () => clearInterval(interval);
        } else if (timerState.status === 'paused' || timerState.status === 'idle') {
          setDisplaySeconds(timerState.pausedRemaining ?? timerState.totalDuration);
        } else if (timerState.status === 'completed') {
          setDisplaySeconds(0);
        }
      }, [timerState.status, timerState.timerEndTimestamp, timerState.pausedRemaining, timerState.totalDuration, syncTimerWithClock]);

      // Listen for iOS Safari returning from background or lock screen
      useEffect(() => {
        const handleVisibilityOrFocus = () => {
          if (document.visibilityState === 'visible') {
            syncTimerWithClock();
          }
        };
        document.addEventListener('visibilitychange', handleVisibilityOrFocus);
        window.addEventListener('focus', handleVisibilityOrFocus);
        window.addEventListener('pageshow', handleVisibilityOrFocus);
        return () => {
          document.removeEventListener('visibilitychange', handleVisibilityOrFocus);
          window.removeEventListener('focus', handleVisibilityOrFocus);
          window.removeEventListener('pageshow', handleVisibilityOrFocus);
        };
      }, [syncTimerWithClock]);

      // Timer Control Actions
      const startRestTimer = useCallback((durationSec, label = 'Rest Period') => {
        const cleanDuration = Math.max(5, Number(durationSec) || 90);
        const endTs = Date.now() + cleanDuration * 1000;
        audioEngine.scheduleChimeInSeconds(cleanDuration);

        if ('Notification' in window && Notification.permission === 'default') {
          Notification.requestPermission().catch(() => {});
        }

        setDisplaySeconds(cleanDuration);
        setTimerState({
          status: 'running',
          totalDuration: cleanDuration,
          timerEndTimestamp: endTs,
          pausedRemaining: cleanDuration,
          label
        });
      }, []);

      const pauseOrResumeTimer = () => {
        audioEngine.unlock();
        if (timerState.status === 'running') {
          const remaining = Math.max(1, Math.ceil((timerState.timerEndTimestamp - Date.now()) / 1000));
          audioEngine.cancelScheduled();
          setDisplaySeconds(remaining);
          setTimerState(prev => ({
            ...prev,
            status: 'paused',
            timerEndTimestamp: null,
            pausedRemaining: remaining
          }));
        } else if (timerState.status === 'paused') {
          const rem = timerState.pausedRemaining || timerState.totalDuration || 90;
          const endTs = Date.now() + rem * 1000;
          audioEngine.scheduleChimeInSeconds(rem);
          setTimerState(prev => ({
            ...prev,
            status: 'running',
            timerEndTimestamp: endTs
          }));
        } else {
          startRestTimer(timerState.totalDuration || 90, timerState.label);
        }
      };

      const adjustTimerSeconds = (deltaSeconds) => {
        audioEngine.unlock();
        if (timerState.status === 'running' && timerState.timerEndTimestamp) {
          const currentRem = Math.max(0, Math.ceil((timerState.timerEndTimestamp - Date.now()) / 1000));
          const nextRem = Math.max(5, currentRem + deltaSeconds);
          const newEndTs = Date.now() + nextRem * 1000;
          audioEngine.scheduleChimeInSeconds(nextRem);
          setDisplaySeconds(nextRem);
          setTimerState(prev => ({
            ...prev,
            totalDuration: Math.max(prev.totalDuration, nextRem),
            timerEndTimestamp: newEndTs,
            pausedRemaining: nextRem
          }));
        } else {
          const base = timerState.pausedRemaining || timerState.totalDuration || 90;
          const nextRem = Math.max(15, base + deltaSeconds);
          setDisplaySeconds(nextRem);
          setTimerState(prev => ({
            ...prev,
            status: prev.status === 'completed' ? 'idle' : prev.status,
            totalDuration: nextRem,
            pausedRemaining: nextRem
          }));
        }
      };

      const resetTimer = () => {
        audioEngine.cancelScheduled();
        const def = timerState.totalDuration || 90;
        setDisplaySeconds(def);
        setTimerState(prev => ({
          ...prev,
          status: 'idle',
          timerEndTimestamp: null,
          pausedRemaining: def
        }));
      };

      // --------------------------------------------------------------------------
      // 6. WORKOUT DRAFT MUTATION HANDLERS (INSTANT AUTO-SAVE)
      // --------------------------------------------------------------------------
      const switchActiveRoutine = (routineId) => {
        const targetRoutine = routines.find(r => r.id === routineId);
        if (!targetRoutine) return;

        // If user has active checked sets or edits, confirm before overwriting draft
        const hasCheckedSets = activeWorkoutDraft.exercises.some(ex => ex.sets.some(s => s.completed));
        if (hasCheckedSets && activeWorkoutDraft.routineId !== routineId) {
          setConfirmModal({
            title: 'Switch Active Routine?',
            message: `You have an in-progress draft for "${activeWorkoutDraft.routineName}". Switching to "${targetRoutine.name}" will start a fresh draft for that routine.`,
            confirmText: 'Switch Routine',
            onConfirm: () => {
              setActiveWorkoutDraft(createDraftFromRoutine(targetRoutine));
              setConfirmModal(null);
              showToast(`Loaded ${targetRoutine.name}`);
            }
          });
        } else {
          setActiveWorkoutDraft(createDraftFromRoutine(targetRoutine));
          showToast(`Loaded ${targetRoutine.name}`);
        }
      };

      const updateSetField = (exerciseId, setId, field, value) => {
        setActiveWorkoutDraft(prev => ({
          ...prev,
          lastSavedAt: Date.now(),
          hasUserEdits: true,
          exercises: prev.exercises.map(ex => {
            if (ex.id !== exerciseId) return ex;
            return {
              ...ex,
              sets: ex.sets.map(s => s.id === setId ? { ...s, [field]: value } : s)
            };
          })
        }));
      };

      const toggleSetCompleted = (exercise, setItem, setIndex) => {
        const nextCompleted = !setItem.completed;
        setActiveWorkoutDraft(prev => ({
          ...prev,
          lastSavedAt: Date.now(),
          hasUserEdits: true,
          exercises: prev.exercises.map(ex => {
            if (ex.id !== exercise.id) return ex;
            return {
              ...ex,
              sets: ex.sets.map(s => s.id === setItem.id ? { ...s, completed: nextCompleted } : s)
            };
          })
        }));

        // Automatically start the background-safe Rest Timer when checking off any set
        if (nextCompleted) {
          const currentRoutine = routines.find(r => r.id === activeWorkoutDraft.routineId);
          const defaultRest = currentRoutine?.defaultRestSeconds || 90;
          startRestTimer(defaultRest, `${exercise.name} (Set ${setIndex + 1})`);
        }
      };

      const copyPreviousBestToExercise = (exerciseId) => {
        setActiveWorkoutDraft(prev => ({
          ...prev,
          lastSavedAt: Date.now(),
          hasUserEdits: true,
          exercises: prev.exercises.map(ex => {
            if (ex.id !== exerciseId) return ex;
            const bestW = String(ex.previousBest?.weight ?? '');
            const bestR = String(ex.previousBest?.reps ?? '');
            return {
              ...ex,
              sets: ex.sets.map(s => ({
                ...s,
                weight: bestW,
                reps: bestR
              }))
            };
          })
        }));
        showToast('Copied Previous Best weight & reps to all sets!');
      };

      const addSetToExercise = (exerciseId) => {
        setActiveWorkoutDraft(prev => ({
          ...prev,
          lastSavedAt: Date.now(),
          hasUserEdits: true,
          exercises: prev.exercises.map(ex => {
            if (ex.id !== exerciseId) return ex;
            const lastSet = ex.sets[ex.sets.length - 1] || { weight: ex.previousBest?.weight || '0', reps: ex.previousBest?.reps || '8' };
            return {
              ...ex,
              sets: [
                ...ex.sets,
                {
                  id: `s-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
                  weight: String(lastSet.weight),
                  reps: String(lastSet.reps),
                  completed: false
                }
              ]
            };
          })
        }));
      };

      const removeSetFromExercise = (exerciseId, setId) => {
        setActiveWorkoutDraft(prev => ({
          ...prev,
          lastSavedAt: Date.now(),
          hasUserEdits: true,
          exercises: prev.exercises.map(ex => {
            if (ex.id !== exerciseId || ex.sets.length <= 1) return ex;
            return {
              ...ex,
              sets: ex.sets.filter(s => s.id !== setId)
            };
          })
        }));
      };

      const moveExerciseInDraft = (index, direction) => {
        setActiveWorkoutDraft(prev => {
          const nextIndex = index + direction;
          if (nextIndex < 0 || nextIndex >= prev.exercises.length) return prev;
          const copy = [...prev.exercises];
          const [moved] = copy.splice(index, 1);
          copy.splice(nextIndex, 0, moved);
          return {
            ...prev,
            lastSavedAt: Date.now(),
            hasUserEdits: true,
            exercises: copy
          };
        });
      };

      const deleteExerciseFromDraft = (exerciseId) => {
        setActiveWorkoutDraft(prev => ({
          ...prev,
          lastSavedAt: Date.now(),
          hasUserEdits: true,
          exercises: prev.exercises.filter(ex => ex.id !== exerciseId)
        }));
        showToast('Removed exercise from session');
      };

      const addExerciseToDraftAndRoutine = (name, repRange, weight, reps, setsCount = 3) => {
        const parts = repRange.split(/[-–]/).map(n => parseInt(n, 10));
        const minR = parts[0] || 8;
        const maxR = parts[1] || 12;
        const newEx = {
          id: `ex-${Date.now()}`,
          name: name.trim(),
          targetSets: Number(setsCount) || 3,
          repRange: repRange || '8–12',
          minReps: minR,
          maxReps: maxR,
          previousBest: { weight: Number(weight) || 45, reps: Number(reps) || 10 },
          sets: Array.from({ length: Number(setsCount) || 3 }, (_, idx) => ({
            id: `s-${Date.now()}-${idx}`,
            weight: String(weight || 45),
            reps: String(reps || 10),
            completed: false
          }))
        };

        setActiveWorkoutDraft(prev => ({
          ...prev,
          lastSavedAt: Date.now(),
          hasUserEdits: true,
          exercises: [...prev.exercises, newEx]
        }));

        // Also update the matching routine template so it persists
        setRoutines(prev => prev.map(r => {
          if (r.id !== activeWorkoutDraft.routineId) return r;
          return { ...r, exercises: [...r.exercises, newEx] };
        }));

        showToast(`Added "${newEx.name}" to ${activeWorkoutDraft.routineName}`);
      };

      const discardCurrentDraft = () => {
        setConfirmModal({
          title: 'Reset Current Workout Draft?',
          message: 'This will clear all checked sets and reset the elapsed session timer back to 00:00.',
          confirmText: 'Reset Draft',
          onConfirm: () => {
            const currentRoutine = routines.find(r => r.id === activeWorkoutDraft.routineId) || routines[0];
            setActiveWorkoutDraft(createDraftFromRoutine(currentRoutine));
            setConfirmModal(null);
            showToast('Workout draft reset');
          }
        });
      };

      const finishAndSaveWorkout = () => {
        // Gather completed sets (or all sets if none checked yet)
        const anyChecked = activeWorkoutDraft.exercises.some(ex => ex.sets.some(s => s.completed));
        const durationMinutes = Math.max(1, Math.round(workoutElapsedSeconds / 60));

        let totalVolume = 0;
        const completedExercises = [];
        const updatedBestMap = {};

        activeWorkoutDraft.exercises.forEach(ex => {
          const validSets = ex.sets.filter(s => anyChecked ? s.completed : (Number(s.reps) > 0));
          if (validSets.length > 0) {
            const formattedSets = validSets.map(s => {
              const w = parseFloat(s.weight) || 0;
              const r = parseInt(s.reps, 10) || 0;
              totalVolume += (w > 0 ? w : 160) * r;
              return { weight: w, reps: r };
            });

            // Find best set from this workout
            let bestSet = formattedSets[0];
            formattedSets.forEach(s => {
              if (s.weight > bestSet.weight || (s.weight === bestSet.weight && s.reps > bestSet.reps)) {
                bestSet = s;
              }
            });

            const prevW = ex.previousBest?.weight || 0;
            const prevR = ex.previousBest?.reps || 0;
            if (bestSet.weight > prevW || (bestSet.weight === prevW && bestSet.reps >= prevR)) {
              updatedBestMap[ex.name.toLowerCase()] = { weight: bestSet.weight, reps: bestSet.reps };
            }

            completedExercises.push({
              name: ex.name,
              sets: formattedSets
            });
          }
        });

        if (completedExercises.length === 0) {
          showToast('Log at least 1 set before saving workout!', 'amber');
          return;
        }

        const newWorkoutRecord = {
          id: `wh-${Date.now()}`,
          date: getTodayISO(),
          routineName: activeWorkoutDraft.routineName,
          durationMinutes,
          totalVolume: Math.round(totalVolume),
          exercises: completedExercises
        };

        setWorkoutHistory(prev => [newWorkoutRecord, ...prev]);

        // Update routines with new previousBest and latest set values
        const updatedRoutines = routines.map(r => {
          if (r.id !== activeWorkoutDraft.routineId) return r;
          return {
            ...r,
            exercises: activeWorkoutDraft.exercises.map(ex => {
              const newBest = updatedBestMap[ex.name.toLowerCase()] || ex.previousBest;
              return {
                ...ex,
                previousBest: newBest,
                sets: ex.sets.map(s => ({ ...s, completed: false }))
              };
            })
          };
        });

        setRoutines(updatedRoutines);

        // Reset active draft cleanly for next session
        const nextTemplate = updatedRoutines.find(r => r.id === activeWorkoutDraft.routineId) || updatedRoutines[0];
        setActiveWorkoutDraft(createDraftFromRoutine(nextTemplate));
        resetTimer();
        showToast(`🏆 Saved ${newWorkoutRecord.routineName}! Volume: ${newWorkoutRecord.totalVolume.toLocaleString()} lbs`, 'emerald');
      };

      // --------------------------------------------------------------------------
      // 7. NUTRITION & HABIT HELPERS
      // --------------------------------------------------------------------------
      const todayISO = getTodayISO();
      const todayLog = dailyNutritionLogs[todayISO] || {
        meals: [],
        habits: { creatine: false, hydration: false, run: false }
      };

      const todayTotals = useMemo(() => {
        return todayLog.meals.reduce(
          (acc, meal) => ({
            calories: acc.calories + (Number(meal.calories) || 0),
            protein: acc.protein + (Number(meal.protein) || 0),
            carbs: acc.carbs + (Number(meal.carbs) || 0),
            fat: acc.fat + (Number(meal.fat) || 0)
          }),
          { calories: 0, protein: 0, carbs: 0, fat: 0 }
        );
      }, [todayLog.meals]);

      const logMealItem = useCallback((item, multiplier = 1) => {
        const mult = Number(multiplier) || 1;
        const entry = {
          id: `meal-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
          name: mult !== 1 ? `${item.name} (${mult}x)` : item.name,
          calories: Math.round((Number(item.calories) || 0) * mult),
          protein: Math.round((Number(item.protein) || 0) * mult),
          carbs: Math.round((Number(item.carbs) || 0) * mult),
          fat: Math.round((Number(item.fat) || 0) * mult),
          servings: mult,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        const dKey = getTodayISO();
        setDailyNutritionLogs(prev => {
          const existing = prev[dKey] || { meals: [], habits: { creatine: false, hydration: false, run: false } };
          return {
            ...prev,
            [dKey]: {
              ...existing,
              meals: [entry, ...existing.meals]
            }
          };
        });
        showToast(`+${entry.calories} kcal (${entry.protein}g P) logged!`);
      }, [showToast]);

      const removeLoggedMeal = (mealId) => {
        const dKey = getTodayISO();
        setDailyNutritionLogs(prev => {
          const existing = prev[dKey];
          if (!existing) return prev;
          return {
            ...prev,
            [dKey]: {
              ...existing,
              meals: existing.meals.filter(m => m.id !== mealId)
            }
          };
        });
      };

      const toggleDailyHabit = useCallback((habitKey, explicitValue = null) => {
        const dKey = getTodayISO();
        setDailyNutritionLogs(prev => {
          const existing = prev[dKey] || { meals: [], habits: { creatine: false, hydration: false, run: false } };
          const nextVal = explicitValue !== null ? Boolean(explicitValue) : !existing.habits[habitKey];
          return {
            ...prev,
            [dKey]: {
              ...existing,
              habits: {
                ...existing.habits,
                [habitKey]: nextVal
              }
            }
          };
        });
      }, []);

      // --------------------------------------------------------------------------
      // 8. STRUCTURED ACTION EXECUTOR FOR COACH AI (GEMINI AGENT)
      // --------------------------------------------------------------------------
      const executeAgentActions = useCallback((actions) => {
        if (!Array.isArray(actions) || actions.length === 0) return [];
        const executedBadges = [];

        actions.forEach(action => {
          if (!action || !action.type) return;
          const type = String(action.type).toUpperCase();

          if (type === 'ADD_MEAL') {
            const mult = Number(action.servings) || 1;
            logMealItem({
              name: action.name || 'King Hall Meal',
              calories: Number(action.calories) || 400,
              protein: Number(action.protein) || 30,
              carbs: Number(action.carbs) || 45,
              fat: Number(action.fat) || 12
            }, 1); // calories passed from AI are usually already total or per serving
            executedBadges.push(`Logged Meal: ${action.name} (${action.calories} kcal, ${action.protein}g P)`);
          }

          if (type === 'LOG_WEIGHT') {
            const w = parseFloat(action.weight);
            if (!isNaN(w) && w > 80 && w < 350) {
              const dateStr = action.date || getTodayISO();
              setWeightHistory(prev => {
                const filtered = prev.filter(item => item.date !== dateStr);
                return [...filtered, { id: `w-${Date.now()}`, date: dateStr, weight: w, notes: action.notes || 'Logged via Coach AI' }]
                  .sort((a, b) => a.date.localeCompare(b.date));
              });
              executedBadges.push(`Logged Bodyweight: ${w.toFixed(1)} lbs`);
            }
          }

          if (type === 'TOGGLE_HABIT') {
            const rawHabit = String(action.habit || '').toLowerCase();
            const key = rawHabit.includes('creat') ? 'creatine' : rawHabit.includes('hydr') || rawHabit.includes('water') ? 'hydration' : 'run';
            const val = action.value !== undefined ? Boolean(action.value) : true;
            toggleDailyHabit(key, val);
            executedBadges.push(`Habit Updated: ${key.toUpperCase()} = ${val ? 'Completed' : 'Unchecked'}`);
          }

          if (type === 'UPDATE_EXERCISE_WEIGHT') {
            const targetName = String(action.exerciseName || '').toLowerCase();
            const delta = Number(action.weightDelta) || 0;
            const explicitWeight = action.newWeight !== undefined ? Number(action.newWeight) : null;

            // Update both routines and activeWorkoutDraft
            setRoutines(prev => prev.map(r => ({
              ...r,
              exercises: r.exercises.map(ex => {
                if (!ex.name.toLowerCase().includes(targetName) && !targetName.includes(ex.name.toLowerCase())) return ex;
                const nextW = explicitWeight !== null ? explicitWeight : (Number(ex.previousBest?.weight) || 0) + delta;
                const nextR = action.newReps ? Number(action.newReps) : (ex.previousBest?.reps || 8);
                return {
                  ...ex,
                  previousBest: { weight: nextW, reps: nextR },
                  sets: ex.sets.map(s => ({ ...s, weight: String(nextW), reps: String(nextR) }))
                };
              })
            })));

            setActiveWorkoutDraft(prev => ({
              ...prev,
              lastSavedAt: Date.now(),
              exercises: prev.exercises.map(ex => {
                if (!ex.name.toLowerCase().includes(targetName) && !targetName.includes(ex.name.toLowerCase())) return ex;
                const nextW = explicitWeight !== null ? explicitWeight : (Number(ex.previousBest?.weight) || 0) + delta;
                const nextR = action.newReps ? Number(action.newReps) : (ex.previousBest?.reps || 8);
                return {
                  ...ex,
                  previousBest: { weight: nextW, reps: nextR },
                  sets: ex.sets.map(s => ({ ...s, weight: String(nextW), reps: String(nextR) }))
                };
              })
            }));

            executedBadges.push(`Updated ${action.exerciseName}: ${explicitWeight !== null ? `${explicitWeight} lbs` : `${delta >= 0 ? '+' : ''}${delta} lbs`}`);
          }

          if (type === 'CREATE_ROUTINE' && action.name) {
            const newRoutine = {
              id: `routine-${Date.now()}`,
              name: action.name,
              subtitle: action.subtitle || 'Custom Coach AI Routine',
              defaultRestSeconds: 90,
              exercises: (action.exercises || []).map((ex, i) => ({
                id: `ex-ai-${Date.now()}-${i}`,
                name: ex.name || `Exercise ${i + 1}`,
                targetSets: Number(ex.sets) || 3,
                repRange: ex.repRange || '8–12',
                minReps: 8,
                maxReps: 12,
                previousBest: { weight: Number(ex.weight) || 45, reps: Number(ex.reps) || 10 },
                sets: Array.from({ length: Number(ex.sets) || 3 }, (_, sIdx) => ({
                  id: `s-ai-${Date.now()}-${i}-${sIdx}`,
                  weight: String(ex.weight || 45),
                  reps: String(ex.reps || 10),
                  completed: false
                }))
              }))
            };
            setRoutines(prev => [...prev, newRoutine]);
            executedBadges.push(`Created Routine: ${newRoutine.name}`);
          }
        });

        if (executedBadges.length > 0) {
          showToast(`🤖 Coach AI executed ${executedBadges.length} update(s)!`, 'emerald');
        }
        return executedBadges;
      }, [logMealItem, toggleDailyHabit, showToast]);

      // --------------------------------------------------------------------------
      // 9. SUPABASE TWO-DEVICE CLOUD SYNC ENGINE
      // --------------------------------------------------------------------------
      const [syncBusy, setSyncBusy] = useState(false);

      const pushToSupabase = useCallback(async (silent = false) => {
        if (!settings.supabaseUrl || !settings.supabaseAnonKey || !settings.syncUserId) {
          if (!silent) showToast('Configure Supabase URL, Anon Key & Sync ID first', 'amber');
          return;
        }
        setSyncBusy(true);
        try {
          const cleanUrl = settings.supabaseUrl.replace(/\/$/, '');
          const endpoint = `${cleanUrl}/rest/v1/user_sync`;
          const payloadSnapshot = {
            routines,
            workoutHistory,
            weightHistory,
            activeWorkoutDraft,
            macroTargets,
            mealLibrary,
            dailyNutritionLogs
          };

          const res = await fetch(endpoint, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'apikey': settings.supabaseAnonKey,
              'Authorization': `Bearer ${settings.supabaseAnonKey}`,
              'Prefer': 'resolution=merge-duplicates'
            },
            body: JSON.stringify({
              user_id: settings.syncUserId,
              payload: payloadSnapshot,
              updated_at: new Date().toISOString()
            })
          });

          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          setSettings(prev => ({ ...prev, lastSyncedAt: new Date().toLocaleTimeString() }));
          if (!silent) showToast('☁️ Cloud Sync: Pushed state to Supabase!', 'emerald');
        } catch (err) {
          if (!silent) showToast(`Supabase Push Error: ${err.message}`, 'amber');
        } finally {
          setSyncBusy(false);
        }
      }, [settings, routines, workoutHistory, weightHistory, activeWorkoutDraft, macroTargets, mealLibrary, dailyNutritionLogs, showToast]);

      const pullFromSupabase = useCallback(async () => {
        if (!settings.supabaseUrl || !settings.supabaseAnonKey || !settings.syncUserId) {
          showToast('Configure Supabase URL, Anon Key & Sync ID first', 'amber');
          return;
        }
        setSyncBusy(true);
        try {
          const cleanUrl = settings.supabaseUrl.replace(/\/$/, '');
          const endpoint = `${cleanUrl}/rest/v1/user_sync?user_id=eq.${encodeURIComponent(settings.syncUserId)}&select=*`;
          const res = await fetch(endpoint, {
            method: 'GET',
            headers: {
              'apikey': settings.supabaseAnonKey,
              'Authorization': `Bearer ${settings.supabaseAnonKey}`
            }
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const rows = await res.json();
          if (!rows || rows.length === 0 || !rows[0].payload) {
            showToast('No remote cloud snapshot found for this Sync ID yet.', 'amber');
            return;
          }
          const remote = rows[0].payload;
          if (remote.routines) setRoutines(remote.routines);
          if (remote.workoutHistory) setWorkoutHistory(remote.workoutHistory);
          if (remote.weightHistory) setWeightHistory(remote.weightHistory);
          if (remote.activeWorkoutDraft) setActiveWorkoutDraft(remote.activeWorkoutDraft);
          if (remote.macroTargets) setMacroTargets(remote.macroTargets);
          if (remote.mealLibrary) setMealLibrary(remote.mealLibrary);
          if (remote.dailyNutritionLogs) setDailyNutritionLogs(remote.dailyNutritionLogs);

          setSettings(prev => ({ ...prev, lastSyncedAt: new Date().toLocaleTimeString() }));
          showToast('☁️ Cloud Sync: Pulled latest data from Supabase!', 'emerald');
        } catch (err) {
          showToast(`Supabase Pull Error: ${err.message}`, 'amber');
        } finally {
          setSyncBusy(false);
        }
      }, [settings, showToast]);

      // Format seconds to MM:SS
      const formatClock = (secs) => {
        const s = Math.max(0, Math.floor(secs));
        const mins = Math.floor(s / 60);
        const rem = s % 60;
        return `${String(mins).padStart(2, '0')}:${String(rem).padStart(2, '0')}`;
      };

      const latestWeight = weightHistory.length > 0 ? weightHistory[weightHistory.length - 1].weight : 160.0;

      // Navigation Tabs Config
      const NAV_TABS = [
        { id: 'workout', label: 'Workout', icon: 'dumbbell' },
        { id: 'nutrition', label: 'Nutrition', icon: 'utensils' },
        { id: 'coach', label: 'Coach AI', icon: 'bot' },
        { id: 'progress', label: 'Progress', icon: 'trendingUp' },
        { id: 'settings', label: 'Sync & Settings', icon: 'settings' }
      ];

      return (
        <div className="min-h-screen flex flex-col md:flex-row bg-slate-100 dark:bg-navy-950 text-slate-900 dark:text-slate-100">

          {/* ====================================================================
              DESKTOP SIDEBAR NAVIGATION (>= 768px)
          ==================================================================== */}
          <aside className="hidden md:flex md:w-64 lg:w-72 md:flex-col md:fixed md:inset-y-0 bg-navy-900 text-white border-r border-navy-700/80 z-40 select-none">
            <div className="p-5 border-b border-navy-800 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gold-500 text-navy-950 flex items-center justify-center font-black shadow-lg shadow-gold-500/20">
                  <Icon name="anchor" size={22} />
                </div>
                <div>
                  <h1 className="font-extrabold tracking-tight text-base leading-none text-white">
                    USNA <span className="text-gold-500">FIT & FUEL</span>
                  </h1>
                  <p className="text-[11px] font-mono text-slate-400 mt-1">
                    5'11" • {latestWeight.toFixed(1)} LBS • 20-25 MI/WK
                  </p>
                </div>
              </div>
            </div>

            {/* Quick Daily Status Summary in Sidebar */}
            <div className="p-4 mx-3 mt-4 rounded-xl bg-navy-800/90 border border-navy-700">
              <div className="flex items-center justify-between text-xs text-slate-300 mb-1.5">
                <span className="font-semibold uppercase tracking-wider text-gold-400">King Hall Fuel</span>
                <span className="font-mono font-bold">{todayTotals.calories} / {macroTargets.calories} kcal</span>
              </div>
              <div className="w-full h-2 bg-navy-950 rounded-full overflow-hidden mb-3">
                <div
                  className="h-full bg-gradient-to-r from-gold-500 to-amber-400 transition-all duration-300"
                  style={{ width: `${Math.min(100, (todayTotals.calories / macroTargets.calories) * 100)}%` }}
                />
              </div>
              <div className="grid grid-cols-3 gap-1.5 text-center font-mono text-[11px]">
                <div className="bg-navy-950/70 rounded-lg py-1 px-1.5">
                  <span className="text-slate-400 block text-[9px]">PROT</span>
                  <span className="text-emerald-400 font-bold">{todayTotals.protein}g</span>
                </div>
                <div className="bg-navy-950/70 rounded-lg py-1 px-1.5">
                  <span className="text-slate-400 block text-[9px]">CARB</span>
                  <span className="text-sky-400 font-bold">{todayTotals.carbs}g</span>
                </div>
                <div className="bg-navy-950/70 rounded-lg py-1 px-1.5">
                  <span className="text-slate-400 block text-[9px]">FAT</span>
                  <span className="text-amber-400 font-bold">{todayTotals.fat}g</span>
                </div>
              </div>
            </div>

            {/* Sidebar Links */}
            <nav className="flex-1 px-3 py-4 space-y-1.5">
              {NAV_TABS.map(tab => {
                const isActive = activeTab === tab.id;
                return (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`w-full flex items-center gap-3.5 px-4 py-3.5 rounded-xl font-semibold text-sm transition-all ${
                      isActive
                        ? 'bg-gold-500 text-navy-950 shadow-md shadow-gold-500/20 font-bold'
                        : 'text-slate-300 hover:bg-navy-800 hover:text-white'
                    }`}
                  >
                    <Icon name={tab.icon} size={20} />
                    <span>{tab.label}</span>
                    {tab.id === 'workout' && activeWorkoutDraft.hasUserEdits && (
                      <span className={`ml-auto w-2 h-2 rounded-full ${isActive ? 'bg-navy-950' : 'bg-emerald-400 animate-ping'}`} />
                    )}
                  </button>
                );
              })}
            </nav>

            {/* Theme Toggle & Bancroft Footer */}
            <div className="p-4 border-t border-navy-800 flex items-center justify-between">
              <button
                onClick={() => setDarkMode(!darkMode)}
                className="flex items-center gap-2.5 px-3.5 py-2 rounded-xl bg-navy-800 hover:bg-navy-700 text-xs font-semibold text-slate-200 transition"
              >
                <Icon name={darkMode ? 'sun' : 'moon'} size={16} className="text-gold-400" />
                <span>{darkMode ? 'Light Mode' : 'Tactical Dark'}</span>
              </button>
              <span className="text-[11px] font-mono text-slate-400">ANNAPOLIS MD</span>
            </div>
          </aside>

          {/* ====================================================================
              MAIN CONTENT WRAPPER
          ==================================================================== */}
          <div className="flex-1 md:pl-64 lg:pl-72 flex flex-col min-h-screen w-full max-w-full">
            {/* Mobile Top Tactical Header (< 768px) */}
            <header className="md:hidden sticky top-0 z-30 bg-navy-900/95 backdrop-blur-md text-white border-b border-navy-800 px-4 pt-safe pb-3">
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-2.5">
                  <div className="w-8 h-8 rounded-lg bg-gold-500 text-navy-950 flex items-center justify-center font-black">
                    <Icon name="anchor" size={18} />
                  </div>
                  <div>
                    <h1 className="font-extrabold text-sm tracking-tight leading-none">
                      USNA <span className="text-gold-500">FIT & FUEL</span>
                    </h1>
                    <p className="text-[10px] font-mono text-slate-300 mt-0.5">
                      {latestWeight.toFixed(1)} lbs • {todayTotals.calories}/{macroTargets.calories} kcal • {todayTotals.protein}g P
                    </p>
                  </div>
                </div>
                <div className="flex items-center gap-2">
                  <button
                    onClick={() => setDarkMode(!darkMode)}
                    aria-label="Toggle Theme"
                    className="p-2 rounded-lg bg-navy-800 text-gold-400 border border-navy-700 active:scale-95 transition"
                  >
                    <Icon name={darkMode ? 'sun' : 'moon'} size={17} />
                  </button>
                </div>
              </div>
            </header>

            {/* Toast Notification Banner */}
            {toast && (
              <div className="fixed top-16 md:top-5 right-4 left-4 md:left-auto md:w-96 z-50 pointer-events-none flex justify-center md:justify-end">
                <div className={`pointer-events-auto px-4 py-3 rounded-xl shadow-2xl border font-semibold text-xs sm:text-sm flex items-center gap-2.5 backdrop-blur-md ${
                  toast.type === 'emerald'
                    ? 'bg-emerald-950/95 border-emerald-500 text-emerald-200'
                    : toast.type === 'amber'
                    ? 'bg-amber-950/95 border-amber-500 text-amber-200'
                    : 'bg-navy-900/95 border-gold-500 text-gold-400'
                }`}>
                  <Icon name="zap" size={16} />
                  <span className="flex-1">{toast.message}</span>
                </div>
              </div>
            )}

            {/* Main View Container with generous bottom padding so floating rest timer NEVER covers cards */}
            <main className="flex-1 w-full max-w-5xl mx-auto px-3.5 sm:px-6 pt-4 pb-52 md:pb-36">
              {activeTab === 'workout' && (
                <WorkoutModule
                  routines={routines}
                  setRoutines={setRoutines}
                  activeWorkoutDraft={activeWorkoutDraft}
                  setActiveWorkoutDraft={setActiveWorkoutDraft}
                  workoutElapsedSeconds={workoutElapsedSeconds}
                  formatClock={formatClock}
                  switchActiveRoutine={switchActiveRoutine}
                  updateSetField={updateSetField}
                  toggleSetCompleted={toggleSetCompleted}
                  copyPreviousBestToExercise={copyPreviousBestToExercise}
                  addSetToExercise={addSetToExercise}
                  removeSetFromExercise={removeSetFromExercise}
                  moveExerciseInDraft={moveExerciseInDraft}
                  deleteExerciseFromDraft={deleteExerciseFromDraft}
                  addExerciseToDraftAndRoutine={addExerciseToDraftAndRoutine}
                  discardCurrentDraft={discardCurrentDraft}
                  finishAndSaveWorkout={finishAndSaveWorkout}
                  startRestTimer={startRestTimer}
                  showToast={showToast}
                />
              )}

              {activeTab === 'nutrition' && (
                <NutritionModule
                  macroTargets={macroTargets}
                  setMacroTargets={setMacroTargets}
                  mealLibrary={mealLibrary}
                  setMealLibrary={setMealLibrary}
                  todayLog={todayLog}
                  todayTotals={todayTotals}
                  logMealItem={logMealItem}
                  removeLoggedMeal={removeLoggedMeal}
                  toggleDailyHabit={toggleDailyHabit}
                  showToast={showToast}
                />
              )}

              {activeTab === 'coach' && (
                <CoachAIModule
                  chatMessages={chatMessages}
                  setChatMessages={setChatMessages}
                  settings={settings}
                  setSettings={setSettings}
                  todayTotals={todayTotals}
                  macroTargets={macroTargets}
                  todayLog={todayLog}
                  activeWorkoutDraft={activeWorkoutDraft}
                  routines={routines}
                  workoutHistory={workoutHistory}
                  weightHistory={weightHistory}
                  executeAgentActions={executeAgentActions}
                  setActiveTab={setActiveTab}
                />
              )}

              {activeTab === 'progress' && (
                <ProgressModule
                  weightHistory={weightHistory}
                  setWeightHistory={setWeightHistory}
                  workoutHistory={workoutHistory}
                  setWorkoutHistory={setWorkoutHistory}
                  showToast={showToast}
                />
              )}

              {activeTab === 'settings' && (
                <SettingsSyncModule
                  settings={settings}
                  setSettings={setSettings}
                  syncBusy={syncBusy}
                  pushToSupabase={pushToSupabase}
                  pullFromSupabase={pullFromSupabase}
                  routines={routines}
                  setRoutines={setRoutines}
                  workoutHistory={workoutHistory}
                  setWorkoutHistory={setWorkoutHistory}
                  weightHistory={weightHistory}
                  setWeightHistory={setWeightHistory}
                  activeWorkoutDraft={activeWorkoutDraft}
                  setActiveWorkoutDraft={setActiveWorkoutDraft}
                  macroTargets={macroTargets}
                  setMacroTargets={setMacroTargets}
                  mealLibrary={mealLibrary}
                  setMealLibrary={setMealLibrary}
                  dailyNutritionLogs={dailyNutritionLogs}
                  setDailyNutritionLogs={setDailyNutritionLogs}
                  showToast={showToast}
                />
              )}
            </main>
          </div>

          {/* ====================================================================
              ALWAYS-VISIBLE FLOATING REST TIMER BAR (iOS BACKGROUND-SAFE, Z-50)
          ==================================================================== */}
          <div className="fixed left-2 right-2 bottom-safe-timer md:left-auto md:right-6 md:bottom-5 md:w-[430px] z-50 select-none">
            <div className={`rounded-2xl border shadow-2xl backdrop-blur-xl transition-all duration-200 px-3.5 py-2.5 ${
              timerState.status === 'completed'
                ? 'bg-emerald-950/95 border-emerald-400 text-white animate-pulse-gold'
                : timerState.status === 'running'
                ? 'bg-navy-900/95 border-gold-500 text-white shadow-gold-500/10'
                : 'bg-navy-900/95 dark:bg-navy-900/95 border-navy-700 text-slate-100'
            }`}>
              <div className="flex items-center justify-between gap-2">
                {/* Left: Timer Countdown & Active Exercise Label */}
                <div className="flex items-center gap-2.5 min-w-0">
                  <button
                    onClick={pauseOrResumeTimer}
                    className={`w-10 h-10 rounded-xl flex items-center justify-center font-bold transition active:scale-95 shrink-0 ${
                      timerState.status === 'running'
                        ? 'bg-gold-500 text-navy-950'
                        : timerState.status === 'completed'
                        ? 'bg-emerald-400 text-navy-950'
                        : 'bg-navy-800 text-gold-400 border border-navy-600'
                    }`}
                    title={timerState.status === 'running' ? 'Pause Rest Timer' : 'Start / Resume Rest Timer'}
                  >
                    <Icon name={timerState.status === 'running' ? 'pause' : 'play'} size={18} />
                  </button>

                  <div className="min-w-0">
                    <div className="flex items-baseline gap-2">
                      <span className={`font-mono text-xl sm:text-2xl font-black tracking-tight ${
                        timerState.status === 'running' ? 'text-gold-400' : timerState.status === 'completed' ? 'text-emerald-300' : 'text-white'
                      }`}>
                        {formatClock(displaySeconds)}
                      </span>
                      <span className="text-[10px] font-mono uppercase px-1.5 py-0.5 rounded bg-navy-800 text-slate-300">
                        {timerState.status === 'running'
                          ? 'LIVE'
                          : timerState.status === 'paused'
                          ? 'PAUSED'
                          : timerState.status === 'completed'
                          ? 'DONE!'
                          : 'READY'}
                      </span>
                    </div>
                    <p className="text-[11px] text-slate-300 truncate max-w-[140px] sm:max-w-[180px]">
                      {timerState.status === 'completed' ? '🔔 Hit your next set!' : timerState.label}
                    </p>
                  </div>
                </div>

                {/* Right: Quick Presets & +/- 15s Controls */}
                <div className="flex items-center gap-1 shrink-0">
                  <button
                    onClick={() => adjustTimerSeconds(-15)}
                    className="px-2 py-1.5 rounded-lg bg-navy-800 hover:bg-navy-700 text-[11px] font-mono font-bold text-slate-200 border border-navy-700 active:scale-95"
                  >
                    -15s
                  </button>
                  <button
                    onClick={() => adjustTimerSeconds(15)}
                    className="px-2 py-1.5 rounded-lg bg-navy-800 hover:bg-navy-700 text-[11px] font-mono font-bold text-slate-200 border border-navy-700 active:scale-95"
                  >
                    +15s
                  </button>
                  <button
                    onClick={resetTimer}
                    className="p-1.5 rounded-lg bg-navy-800 hover:bg-navy-700 text-slate-300 border border-navy-700 active:scale-95"
                    title="Reset Timer"
                  >
                    <Icon name="rotateCcw" size={15} />
                  </button>
                </div>
              </div>

              {/* Preset Row (60s, 90s, 2m, 2m30s) */}
              <div className="grid grid-cols-4 gap-1.5 mt-2 pt-2 border-t border-navy-800/90">
                {[
                  { label: '60s', sec: 60 },
                  { label: '90s', sec: 90 },
                  { label: '2m', sec: 120 },
                  { label: '2m30s', sec: 150 }
                ].map(p => (
                  <button
                    key={p.sec}
                    onClick={() => startRestTimer(p.sec, `${p.label} Rest`)}
                    className={`py-1 rounded-lg font-mono text-xs font-bold transition active:scale-95 ${
                      timerState.totalDuration === p.sec && timerState.status === 'running'
                        ? 'bg-gold-500 text-navy-950'
                        : 'bg-navy-800/90 hover:bg-navy-700 text-slate-300'
                    }`}
                  >
                    {p.label}
                  </button>
                ))}
              </div>
            </div>
          </div>

          {/* ====================================================================
              MOBILE FIXED BOTTOM TAB BAR (< 768px, iPhone Safari PWA Safe)
          ==================================================================== */}
          <nav className="md:hidden fixed bottom-0 inset-x-0 z-40 bg-navy-900/95 backdrop-blur-lg border-t border-navy-800 pb-safe-nav select-none">
            <div className="grid grid-cols-5 h-16">
              {NAV_TABS.map(tab => {
                const isActive = activeTab === tab.id;
                return (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`flex flex-col items-center justify-center gap-1 relative transition ${
                      isActive ? 'text-gold-500 font-bold' : 'text-slate-400 hover:text-slate-200'
                    }`}
                  >
                    {isActive && (
                      <span className="absolute top-0 inset-x-4 h-0.5 bg-gold-500 rounded-full" />
                    )}
                    <Icon name={tab.icon} size={20} />
                    <span className="text-[10px] tracking-tight leading-none">{tab.label.split(' ')[0]}</span>
                  </button>
                );
              })}
            </div>
          </nav>

          {/* ====================================================================
              CUSTOM CONFIRMATION MODAL (No window.confirm)
          ==================================================================== */}
          {confirmModal && (
            <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white dark:bg-navy-900 border border-slate-200 dark:border-navy-700 rounded-2xl max-w-md w-full p-5 shadow-2xl">
                <h3 className="text-lg font-extrabold text-slate-900 dark:text-white">
                  {confirmModal.title}
                </h3>
                <p className="text-sm text-slate-600 dark:text-slate-300 mt-2">
                  {confirmModal.message}
                </p>
                <div className="flex items-center justify-end gap-2.5 mt-5">
                  <button
                    onClick={() => setConfirmModal(null)}
                    className="px-4 py-2.5 rounded-xl font-semibold text-sm bg-slate-200 dark:bg-navy-800 text-slate-800 dark:text-slate-200"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={confirmModal.onConfirm}
                    className="px-4 py-2.5 rounded-xl font-bold text-sm bg-gold-500 text-navy-950"
                  >
                    {confirmModal.confirmText || 'Confirm'}
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ============================================================================
    // MODULE A: UNLIMITED WORKOUT TRACKER (PUSH / PULL / LEGS + CUSTOM ROUTINES)
    // ============================================================================
    function WorkoutModule({
      routines,
      setRoutines,
      activeWorkoutDraft,
      workoutElapsedSeconds,
      formatClock,
      switchActiveRoutine,
      updateSetField,
      toggleSetCompleted,
      copyPreviousBestToExercise,
      addSetToExercise,
      removeSetFromExercise,
      moveExerciseInDraft,
      deleteExerciseFromDraft,
      addExerciseToDraftAndRoutine,
      discardCurrentDraft,
      finishAndSaveWorkout,
      startRestTimer,
      showToast
    }) {
      const [showAddExercise, setShowAddExercise] = useState(false);
      const [newExName, setNewExName] = useState('');
      const [newExRepRange, setNewExRepRange] = useState('8–12');
      const [newExWeight, setNewExWeight] = useState('45');
      const [newExReps, setNewExReps] = useState('10');
      const [newExSets, setNewExSets] = useState('3');

      const [showNewRoutineModal, setShowNewRoutineModal] = useState(false);
      const [customRoutineName, setCustomRoutineName] = useState('');
      const [customRoutineSub, setCustomRoutineSub] = useState('');

      const completedSetsCount = useMemo(() => {
        return activeWorkoutDraft.exercises.reduce(
          (acc, ex) => acc + ex.sets.filter(s => s.completed).length,
          0
        );
      }, [activeWorkoutDraft.exercises]);

      const totalSetsCount = useMemo(() => {
        return activeWorkoutDraft.exercises.reduce((acc, ex) => acc + ex.sets.length, 0);
      }, [activeWorkoutDraft.exercises]);

      const handleCreateRoutine = (e) => {
        e.preventDefault();
        if (!customRoutineName.trim()) return;
        const newRoutine = {
          id: `routine-${Date.now()}`,
          name: customRoutineName.trim(),
          subtitle: customRoutineSub.trim() || 'Custom Midshipman Training Block',
          defaultRestSeconds: 90,
          exercises: [
            {
              id: `ex-${Date.now()}`,
              name: 'Primary Compound Lift',
              targetSets: 3,
              repRange: '6–10',
              minReps: 6,
              maxReps: 10,
              previousBest: { weight: 95, reps: 8 },
              sets: [
                { id: 's1', weight: '95', reps: '8', completed: false },
                { id: 's2', weight: '95', reps: '8', completed: false },
                { id: 's3', weight: '95', reps: '8', completed: false }
              ]
            }
          ]
        };
        setRoutines(prev => [...prev, newRoutine]);
        setCustomRoutineName('');
        setCustomRoutineSub('');
        setShowNewRoutineModal(false);
        switchActiveRoutine(newRoutine.id);
      };

      const handleAddExerciseSubmit = (e) => {
        e.preventDefault();
        if (!newExName.trim()) return;
        addExerciseToDraftAndRoutine(newExName, newExRepRange, newExWeight, newExReps, newExSets);
        setNewExName('');
        setShowAddExercise(false);
      };

      return (
        <div className="space-y-5">
          {/* Top Routine Selector Strip */}
          <div className="bg-white dark:bg-navy-900 rounded-2xl p-4 border border-slate-200 dark:border-navy-800 shadow-sm">
            <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
              <div>
                <span className="text-[11px] font-mono uppercase tracking-wider text-gold-600 dark:text-gold-400 font-bold">
                  3-Day Hypertrophy + 20–25 Mi/Wk Run Protocol
                </span>
                <h2 className="text-xl sm:text-2xl font-black tracking-tight text-slate-900 dark:text-white">
                  Active Training Split
                </h2>
              </div>

              <button
                onClick={() => setShowNewRoutineModal(true)}
                className="px-3.5 py-2 rounded-xl bg-slate-100 dark:bg-navy-800 hover:bg-gold-500 hover:text-navy-950 text-xs font-bold flex items-center gap-1.5 transition"
              >
                <Icon name="plus" size={15} />
                <span>New Routine</span>
              </button>
            </div>

            {/* Routine Pills */}
            <div className="flex items-center gap-2 overflow-x-auto pb-1 no-scrollbar">
              {routines.map(routine => {
                const isSelected = routine.id === activeWorkoutDraft.routineId;
                return (
                  <button
                    key={routine.id}
                    onClick={() => switchActiveRoutine(routine.id)}
                    className={`px-4 py-2.5 rounded-xl font-bold text-xs sm:text-sm whitespace-nowrap transition flex items-center gap-2 shrink-0 ${
                      isSelected
                        ? 'bg-gold-500 text-navy-950 shadow-md shadow-gold-500/20'
                        : 'bg-slate-100 dark:bg-navy-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-navy-700'
                    }`}
                  >
                    <Icon name="dumbbell" size={15} />
                    <span>{routine.name}</span>
                  </button>
                );
              })}
            </div>

            {/* Real-Time Auto-Save Status Bar */}
            <div className="mt-4 pt-3 border-t border-slate-200 dark:border-navy-800 flex flex-wrap items-center justify-between gap-2">
              <div className="flex items-center gap-2">
                <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 border border-emerald-500/30">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse" />
                  In-Progress Workout Auto-Saved
                </span>
                <span className="text-xs font-mono text-slate-500 dark:text-slate-400">
                  Elapsed: <strong className="text-slate-800 dark:text-slate-200">{formatClock(workoutElapsedSeconds)}</strong>
                </span>
                <span className="text-xs font-mono text-slate-500 dark:text-slate-400 hidden sm:inline">
                  • Sets: <strong className="text-gold-500">{completedSetsCount}/{totalSetsCount}</strong>
                </span>
              </div>

              <div className="flex items-center gap-2">
                <button
                  onClick={discardCurrentDraft}
                  className="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 dark:bg-navy-800 text-slate-600 dark:text-slate-300 hover:text-rose-400 transition"
                >
                  Discard Draft
                </button>
                <button
                  onClick={finishAndSaveWorkout}
                  className="px-4 py-1.5 rounded-lg text-xs font-extrabold bg-emerald-500 hover:bg-emerald-400 text-navy-950 shadow-sm flex items-center gap-1.5 transition active:scale-95"
                >
                  <Icon name="check" size={15} />
                  <span>Finish & Save Workout</span>
                </button>
              </div>
            </div>
          </div>

          {/* Exercise Cards List */}
          <div className="space-y-4">
            {activeWorkoutDraft.exercises.map((exercise, exIdx) => {
              // Check if user hit top of double-progression rep range on all sets
              const maxTarget = exercise.maxReps || 10;
              const readyToProgress = exercise.sets.length > 0 && exercise.sets.every(
                s => (parseInt(s.reps, 10) || 0) >= maxTarget && (parseFloat(s.weight) || 0) >= (exercise.previousBest?.weight || 0)
              );

              return (
                <div
                  key={exercise.id}
                  className="bg-white dark:bg-navy-900 rounded-2xl border border-slate-200 dark:border-navy-800 shadow-sm overflow-hidden"
                >
                  {/* Exercise Header */}
                  <div className="p-4 bg-slate-50/70 dark:bg-navy-800/50 border-b border-slate-200 dark:border-navy-800 flex flex-wrap items-start justify-between gap-2">
                    <div className="space-y-1">
                      <div className="flex flex-wrap items-center gap-2">
                        <span className="w-6 h-6 rounded-lg bg-gold-500/20 text-gold-600 dark:text-gold-400 font-mono text-xs font-extrabold flex items-center justify-center">
                          {exIdx + 1}
                        </span>
                        <h3 className="font-extrabold text-base sm:text-lg text-slate-900 dark:text-white">
                          {exercise.name}
                        </h3>
                        <span className="px-2 py-0.5 rounded-md bg-slate-200 dark:bg-navy-700 font-mono text-xs font-semibold text-slate-700 dark:text-slate-300">
                          {exercise.sets.length} × {exercise.repRange}
                        </span>
                        {readyToProgress && (
                          <span className="px-2 py-0.5 rounded-md bg-gold-500/20 border border-gold-500/40 text-gold-500 font-mono text-[11px] font-bold">
                            ★ Hit Top Reps — Add +5 lbs Next Week!
                          </span>
                        )}
                      </div>

                      {/* Previous Best Readout */}
                      <div className="flex items-center gap-3 text-xs text-slate-500 dark:text-slate-400 pl-8">
                        <span>
                          Previous Best:{' '}
                          <strong className="font-mono text-slate-800 dark:text-gold-400">
                            {exercise.previousBest?.weight || 0} lbs × {exercise.previousBest?.reps || 0}
                          </strong>
                        </span>
                        <button
                          onClick={() => copyPreviousBestToExercise(exercise.id)}
                          className="inline-flex items-center gap-1 text-xs font-bold text-sky-600 dark:text-sky-400 hover:underline"
                        >
                          <Icon name="copy" size={12} />
                          <span>Copy Last</span>
                        </button>
                      </div>
                    </div>

                    {/* Reorder & Delete Controls */}
                    <div className="flex items-center gap-1">
                      <button
                        onClick={() => moveExerciseInDraft(exIdx, -1)}
                        disabled={exIdx === 0}
                        className="p-1.5 rounded-lg bg-slate-200/70 dark:bg-navy-800 text-slate-600 dark:text-slate-300 disabled:opacity-30"
                        title="Move Up"
                      >
                        <Icon name="chevronUp" size={15} />
                      </button>
                      <button
                        onClick={() => moveExerciseInDraft(exIdx, 1)}
                        disabled={exIdx === activeWorkoutDraft.exercises.length - 1}
                        className="p-1.5 rounded-lg bg-slate-200/70 dark:bg-navy-800 text-slate-600 dark:text-slate-300 disabled:opacity-30"
                        title="Move Down"
                      >
                        <Icon name="chevronDown" size={15} />
                      </button>
                      <button
                        onClick={() => deleteExerciseFromDraft(exercise.id)}
                        className="p-1.5 rounded-lg bg-slate-200/70 dark:bg-navy-800 text-rose-500 hover:bg-rose-500/20"
                        title="Remove Exercise"
                      >
                        <Icon name="trash" size={15} />
                      </button>
                    </div>
                  </div>

                  {/* Sets Table */}
                  <div className="p-3 sm:p-4 space-y-2">
                    <div className="grid grid-cols-12 gap-2 text-[11px] font-mono uppercase tracking-wider text-slate-400 px-1">
                      <div className="col-span-2 sm:col-span-1">Set</div>
                      <div className="col-span-3 sm:col-span-4">Prev Best</div>
                      <div className="col-span-3">Lbs</div>
                      <div className="col-span-2">Reps</div>
                      <div className="col-span-2 text-right">Done</div>
                    </div>

                    {exercise.sets.map((setItem, sIdx) => (
                      <div
                        key={setItem.id}
                        className={`grid grid-cols-12 gap-2 items-center p-2 rounded-xl border transition ${
                          setItem.completed
                            ? 'bg-emerald-500/10 border-emerald-500/40'
                            : 'bg-slate-50 dark:bg-navy-950/60 border-slate-200/80 dark:border-navy-800'
                        }`}
                      >
                        {/* Set Number */}
                        <div className="col-span-2 sm:col-span-1 flex items-center gap-1">
                          <span className="font-mono font-bold text-xs sm:text-sm text-slate-600 dark:text-slate-300 pl-1">
                            #{sIdx + 1}
                          </span>
                        </div>

                        {/* Previous Best Reference */}
                        <div className="col-span-3 sm:col-span-4">
                          <button
                            type="button"
                            onClick={() => {
                              updateSetField(exercise.id, setItem.id, 'weight', String(exercise.previousBest?.weight || 0));
                              updateSetField(exercise.id, setItem.id, 'reps', String(exercise.previousBest?.reps || 8));
                            }}
                            className="text-left font-mono text-xs text-slate-500 dark:text-slate-400 hover:text-gold-400 truncate max-w-full"
                            title="Tap to copy to this set"
                          >
                            {exercise.previousBest?.weight || 0} × {exercise.previousBest?.reps || 0}
                          </button>
                        </div>

                        {/* Weight Input (Instant Auto-Save) */}
                        <div className="col-span-3">
                          <input
                            type="number"
                            inputMode="decimal"
                            value={setItem.weight}
                            onChange={(e) => updateSetField(exercise.id, setItem.id, 'weight', e.target.value)}
                            placeholder="Lbs"
                            className="w-full px-2.5 py-2 rounded-lg font-mono font-bold text-sm sm:text-base text-center bg-white dark:bg-navy-800 border border-slate-300 dark:border-navy-700 text-slate-900 dark:text-white focus:outline-none focus:border-gold-500"
                          />
                        </div>

                        {/* Reps Input (Instant Auto-Save) */}
                        <div className="col-span-2">
                          <input
                            type="number"
                            inputMode="numeric"
                            value={setItem.reps}
                            onChange={(e) => updateSetField(exercise.id, setItem.id, 'reps', e.target.value)}
                            placeholder="Reps"
                            className="w-full px-2 py-2 rounded-lg font-mono font-bold text-sm sm:text-base text-center bg-white dark:bg-navy-800 border border-slate-300 dark:border-navy-700 text-slate-900 dark:text-white focus:outline-none focus:border-gold-500"
                          />
                        </div>

                        {/* Large Tap-Target Set Complete Checkbox + Remove Set */}
                        <div className="col-span-2 flex items-center justify-end gap-1">
                          <button
                            type="button"
                            onClick={() => toggleSetCompleted(exercise, setItem, sIdx)}
                            className={`h-10 w-11 rounded-xl flex items-center justify-center font-bold transition active:scale-90 ${
                              setItem.completed
                                ? 'bg-emerald-500 text-navy-950 shadow-md shadow-emerald-500/20'
                                : 'bg-slate-200 dark:bg-navy-800 text-slate-500 dark:text-slate-400 hover:border-gold-500 border border-transparent'
                            }`}
                            title="Complete Set & Auto-Start Rest Timer"
                          >
                            <Icon name="check" size={19} />
                          </button>
                        </div>
                      </div>
                    ))}

                    {/* Add / Remove Set Footer */}
                    <div className="flex items-center justify-between pt-2">
                      <div className="flex items-center gap-2">
                        <button
                          type="button"
                          onClick={() => addSetToExercise(exercise.id)}
                          className="px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-100 dark:bg-navy-800 hover:bg-gold-500 hover:text-navy-950 text-slate-700 dark:text-slate-300 flex items-center gap-1 transition"
                        >
                          <Icon name="plus" size={14} />
                          <span>Add Set</span>
                        </button>
                        {exercise.sets.length > 1 && (
                          <button
                            type="button"
                            onClick={() => removeSetFromExercise(exercise.id, exercise.sets[exercise.sets.length - 1].id)}
                            className="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-100 dark:bg-navy-800 text-slate-500 hover:text-rose-400 transition"
                          >
                            - Set
                          </button>
                        )}
                      </div>

                      <button
                        type="button"
                        onClick={() => startRestTimer(90, exercise.name)}
                        className="text-xs font-mono font-semibold text-gold-600 dark:text-gold-400 flex items-center gap-1 hover:underline"
                      >
                        <Icon name="timer" size={14} />
                        <span>Rest 90s</span>
                      </button>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>

          {/* Add Exercise Form / Button */}
          {!showAddExercise ? (
            <button
              onClick={() => setShowAddExercise(true)}
              className="w-full py-3.5 rounded-2xl border-2 border-dashed border-slate-300 dark:border-navy-700 hover:border-gold-500 text-slate-600 dark:text-slate-300 font-bold text-sm flex items-center justify-center gap-2 transition"
            >
              <Icon name="plus" size={18} />
